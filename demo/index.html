<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SPORTident station tool</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    /* Taken from the orienteering map legend: open land yellow, forest green,
       course overprint purple, contour brown, detail black. */
    --paper: #ffffff;
    --open: #ffef9e;
    --open-soft: #fff9dc;
    --forest: #97d5a5;
    --forest-deep: #1f6b3b;
    --overprint: #c8007a;
    --contour: #b45309;
    --detail: #14181b;
    --muted: #5d666c;
    --rule: #d9d5c8;

    --font-ui: 'Archivo', 'Helvetica Neue', Arial, sans-serif;
    --font-data: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  }

  * { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--detail);
    font-family: var(--font-ui);
    font-size: 15px;
    line-height: 1.5;
  }

  /* The page sits on a faint map grid, the way a control description sits on
     the map itself. */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(var(--open-soft) 1px, transparent 1px),
      linear-gradient(90deg, var(--open-soft) 1px, transparent 1px);
    background-size: 28px 28px;
    z-index: -1;
  }

  .shell {
    max-width: 1120px;
    margin: 0 auto;
    padding: 28px 20px 64px;
  }

  header {
    display: flex;
    align-items: center;
    gap: 22px;
    flex-wrap: wrap;
    padding-bottom: 20px;
    border-bottom: 2px solid var(--detail);
  }

  .control-circle { flex: none; }
  .control-circle circle { fill: none; stroke: var(--overprint); stroke-width: 5; }
  .control-circle text {
    font-family: var(--font-ui);
    font-weight: 700;
    font-size: 26px;
    fill: var(--overprint);
    text-anchor: middle;
    dominant-baseline: central;
  }
  .control-circle.idle circle { stroke: var(--rule); }
  .control-circle.idle text { fill: var(--muted); }

  h1 {
    font-size: 27px;
    font-weight: 700;
    letter-spacing: -0.015em;
    margin: 0;
  }

  .lede { margin: 2px 0 0; color: var(--muted); max-width: 54ch; }

  .actions { margin-left: auto; display: flex; gap: 10px; flex-wrap: wrap; }

  button {
    font: inherit;
    font-weight: 600;
    padding: 9px 16px;
    border-radius: 2px;
    border: 2px solid var(--detail);
    background: var(--paper);
    color: var(--detail);
    cursor: pointer;
  }
  button:hover:not(:disabled) { background: var(--open); }
  button:focus-visible { outline: 3px solid var(--overprint); outline-offset: 2px; }
  button:disabled { opacity: 0.35; cursor: not-allowed; }
  button.primary { background: var(--overprint); border-color: var(--overprint); color: #fff; }
  button.primary:hover:not(:disabled) { background: #a30063; border-color: #a30063; }
  button.quiet { border-color: var(--rule); font-weight: 500; }

  .columns {
    display: grid;
    grid-template-columns: minmax(0, 320px) minmax(0, 1fr);
    gap: 28px;
    margin-top: 26px;
    align-items: start;
  }
  @media (max-width: 820px) {
    .columns { grid-template-columns: 1fr; }
  }

  h2 {
    font-size: 15px;
    font-weight: 700;
    margin: 0 0 10px;
  }

  section + section { margin-top: 26px; }

  .facts { margin: 0; font-size: 14px; }
  .facts div {
    display: flex;
    justify-content: space-between;
    gap: 14px;
    padding: 6px 0;
    border-bottom: 1px solid var(--rule);
  }
  .facts dt { color: var(--muted); }
  .facts dd { margin: 0; font-family: var(--font-data); text-align: right; }

  .stack { display: flex; flex-direction: column; gap: 8px; align-items: stretch; }

  .card-log { display: flex; flex-direction: column; gap: 14px; }

  /* A read card is laid out like the split printout it replaces. */
  .readout {
    border: 2px solid var(--detail);
    background: var(--paper);
  }
  .readout > header {
    display: flex;
    align-items: baseline;
    gap: 14px;
    border: 0;
    padding: 10px 14px;
    background: var(--open);
    border-bottom: 2px solid var(--detail);
  }
  .readout .number { font-size: 21px; font-weight: 700; font-family: var(--font-data); }
  .readout .meta { color: var(--muted); font-size: 13px; }
  .readout .meta strong { color: var(--detail); font-weight: 600; }

  table { width: 100%; border-collapse: collapse; font-family: var(--font-data); font-size: 13px; }
  th {
    text-align: left;
    font-weight: 500;
    color: var(--muted);
    font-family: var(--font-ui);
    padding: 6px 14px;
    border-bottom: 1px solid var(--rule);
  }
  td { padding: 4px 14px; border-bottom: 1px solid var(--open-soft); }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  tbody tr:last-child td { border-bottom: 0; }
  tr.split-line td { border-top: 1px solid var(--rule); }

  .empty {
    border: 2px dashed var(--rule);
    padding: 26px 20px;
    color: var(--muted);
    text-align: center;
  }

  .log {
    font-family: var(--font-data);
    font-size: 12px;
    background: var(--detail);
    color: #e7f0e9;
    padding: 12px;
    height: 190px;
    overflow: auto;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .log .tx { color: var(--forest); }
  .log .rx { color: #ffe27a; }
  .log .err { color: #ff8fb8; }

  .status {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    color: var(--muted);
  }
  .status::before {
    content: '';
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--rule);
  }
  .status.live::before { background: var(--forest-deep); }
  .status.warn::before { background: var(--contour); }
  .status.bad::before { background: var(--overprint); }

  .notice {
    border-left: 4px solid var(--contour);
    background: var(--open-soft);
    padding: 10px 14px;
    font-size: 14px;
  }

  label.toggle { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--muted); }

  .progress { height: 6px; background: var(--open-soft); border: 1px solid var(--rule); }
  .progress i { display: block; height: 100%; background: var(--overprint); width: 0; }

  @media (prefers-reduced-motion: no-preference) {
    .readout { animation: punch-in 180ms ease-out; }
    @keyframes punch-in {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: none; }
    }
  }
</style>
</head>
<body>
<div class="shell">
  <header>
    <svg class="control-circle idle" id="circle" width="72" height="72" viewBox="0 0 72 72" aria-hidden="true">
      <circle cx="36" cy="36" r="28" />
      <text x="36" y="37" id="circleText">–</text>
    </svg>
    <div>
      <h1>SPORTident station tool</h1>
      <p class="lede">Read cards, empty a control's memory and set stations up for an event, straight from the browser.</p>
    </div>
    <div class="actions">
      <button id="connect" class="primary">Connect a station</button>
      <button id="simulate" class="quiet">Try it without hardware</button>
      <button id="disconnect" disabled>Disconnect</button>
    </div>
  </header>

  <p class="notice" id="support" hidden></p>

  <div class="columns">
    <aside>
      <section>
        <h2>Station</h2>
        <p class="status" id="status">Nothing connected</p>
        <dl class="facts" id="facts"></dl>
      </section>

      <section>
        <h2>Set up</h2>
        <div class="stack">
          <button id="beep" disabled>Beep the station</button>
          <button id="syncClock" disabled>Set clock to this computer</button>
          <button id="readBackup" disabled>Read backup memory</button>
          <button id="eraseBackup" disabled>Erase backup memory</button>
          <button id="saveSysval" disabled>Download configuration</button>
          <button id="powerOff" disabled>Switch the station off</button>
          <div class="progress" id="progress" hidden><i></i></div>
        </div>
      </section>

      <section>
        <h2>Serial traffic</h2>
        <label class="toggle">
          <input type="checkbox" id="showHex" /> Show every byte
        </label>
        <div class="log" id="log" role="log" aria-live="polite"></div>
      </section>
    </aside>

    <main>
      <section>
        <h2 id="resultsHeading">Cards read</h2>
        <div class="actions" style="margin: 0 0 12px;">
          <button id="exportCards" class="quiet" disabled>Download as CSV</button>
          <button id="clearCards" class="quiet" disabled>Clear the list</button>
        </div>
        <div class="card-log" id="cards">
          <p class="empty">Put a card in the station and the readout appears here.</p>
        </div>
      </section>
    </main>
  </div>
</div>

<script type="module" src="./app.js"></script>
</body>
</html>
